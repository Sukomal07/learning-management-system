name: Backend CI

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    paths:
      - 'server/**'

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build Backend
        run: npm run build

      - name: Build Docker Image
        run: docker build -t lms-backend:${{ github.sha }} .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: lms-backend:${{ github.sha }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: server/dist