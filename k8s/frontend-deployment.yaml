apiVersion: apps/v1
kind: Deployment

metadata:
  name: lms-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: lms-frontend

  template:
    metadata:
      labels:
        app: lms-frontend

    spec:
      containers:
      - name: frontend
        image:  jaydipaws/lms-frontend:latest

        ports:
        - containerPort: 80

        imagePullPolicy: Always